<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison Influence - Site en construction</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        /* --- STYLE DE BASE DU SITE (REPRIS DE TON CSS) --- */
        :root {
            --yellow: #FFD800;
            --yellow-light: #FFF3A4;
            --black: #0C0C0C;
            --black-light: #1A1A1A;
            --white: #FFFFFF;
            --grey-light: #F8F8F8;
            --grey: #EFEFEF;
            --grey-dark: #7D7D7D;
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--black);
            background-color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--black);
            margin-bottom: 1rem;
        }

        h1 span {
            color: var(--yellow);
        }

        p {
            font-size: 1.2rem;
            color: var(--grey-dark);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 2rem;
        }

        .logo span {
            color: var(--yellow);
        }

        .container {
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Maison <span>Influence</span></div>
        <h1>Notre site arrive bientôt <span>!</span></h1>
        <p>Nous préparons quelque chose de génial. Reste connecté.</p>
    </div>
</body>
</html>
